name: JUCE update

# Weekly check for a newer JUCE release. Opens a pull request that changes TORDEN_JUCE_TAG in CMakeLists.txt;
# CI then builds Torden and runs the render test with the new version, so nothing is merged unchecked.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the latest JUCE release
        id: juce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(sed -n 's/^set(TORDEN_JUCE_TAG "\(.*\)")/\1/p' CMakeLists.txt)
          LATEST=$(gh api repos/juce-framework/JUCE/releases/latest --jq .tag_name)
          echo "current=$CURRENT latest=$LATEST"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          [ "$CURRENT" != "$LATEST" ] && echo "update=true" >> "$GITHUB_OUTPUT" || true

      - name: Open pull request
        if: steps.juce.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.juce.outputs.current }}
          LATEST: ${{ steps.juce.outputs.latest }}
        run: |
          BRANCH="juce-$LATEST"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then echo "PR branch exists"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i "s/^set(TORDEN_JUCE_TAG \".*\")/set(TORDEN_JUCE_TAG \"$LATEST\")/" CMakeLists.txt
          git commit -am "Update JUCE to $LATEST"
          git push origin "$BRANCH"
          gh pr create --title "Update JUCE to $LATEST" --head "$BRANCH" \
            --body "JUCE $CURRENT → $LATEST. See the [release notes](https://github.com/juce-framework/JUCE/releases/tag/$LATEST) and BREAKING_CHANGES.md. Merge only if CI is green."
