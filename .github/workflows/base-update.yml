name: fjord-base update

# Weekly: opens a pull request when fjord-base has a newer release than FJORD_BASE_TAG in CMakeLists.txt.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    uses: fjord-sounds/fjord-base/.github/workflows/base-update.yml@main
