name: Bug report
description: Something sounds wrong, crashes or does not work in your DAW
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Load preset ...\n2. Play ...\n3. ..."
  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: Click the "torden." logo in the plugin, then "Copy debug info", and paste it here. It contains the version, host, system and the changed parameters (the home folder is shortened to ~).
      render: text
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options: [VST3, Audio Unit, LV2, Standalone]
    validations:
      required: true
